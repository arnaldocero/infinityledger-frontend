<div class="login-wrapper">
    <div class="login-card">
      <div class="login-header">
        <h2>CodeLedger</h2>
        <p>Ingreso al Sistema Contable</p>
      </div>
  
      <div *ngIf="errorMessage" class="error-alert">
        {{ errorMessage }}
      </div>
  
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        
        <div class="form-group">
          <label for="email">Correo Electrónico</label>
          <input id="email" type="email" formControlName="email" placeholder="admin@codeledger.com">
          <span class="error-text" *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
            Ingrese un correo válido.
          </span>
        </div>
  
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input id="password" type="password" formControlName="password" placeholder="********">
          <span class="error-text" *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
            La contraseña es obligatoria (mínimo 6 caracteres).
          </span>
        </div>
  
        <button type="submit" [disabled]="loginForm.invalid || isLoading">
          {{ isLoading ? 'Verificando...' : 'Iniciar Sesión' }}
        </button>
  
      </form>
    </div>
  </div>
